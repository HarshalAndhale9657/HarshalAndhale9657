name: Profile Metrics

# Renders GitHub stats to static SVGs committed into assets/.
# Why static: the shared github-readme-stats / trophy Vercel instances are
# rate-limited and intermittently serve broken images. These files are ours.
#
# SETUP (one time):
#   1. Create a classic PAT with scopes: read:user, repo
#      https://github.com/settings/tokens/new?scopes=read:user,repo&description=metrics
#   2. Add it as repo secret METRICS_TOKEN
#      https://github.com/HarshalAndhale9657/HarshalAndhale9657/settings/secrets/actions
#   3. Actions -> Profile Metrics -> Run workflow

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/metrics.yml"

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # ── Panel 1 ── overview: commits, PRs, stars + full-year isometric calendar
      - name: Overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: HarshalAndhale9657
          filename: assets/metrics-overview.svg
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Kolkata
          config_display: large
          config_padding: 4%
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          extras_css: |
            :root { --color-calendar-graph-day-L4-bg:#00E58A; --color-calendar-graph-day-L3-bg:#00B36D;
                    --color-calendar-graph-day-L2-bg:#00754A; --color-calendar-graph-day-L1-bg:#0C3A2A; }
            svg { --color-bg: #0B0E14; --color-text: #C9D1D9; --color-title: #56D4FF; }
            .field, .row { color: #C9D1D9; }

      # ── Panel 2 ── real language breakdown, weighted by recent commits
      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: HarshalAndhale9657
          filename: assets/metrics-languages.svg
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          config_padding: 4%
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used, recently-used
          plugin_languages_recent_days: 180
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_ignored: >-
            html, css, scss, makefile, dockerfile, shell, batchfile,
            jupyter notebook, mdx, tex, roff

      # ── Panel 3 ── when the work actually happens (habits + activity)
      - name: Habits
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: HarshalAndhale9657
          filename: assets/metrics-habits.svg
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          config_padding: 4%
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_charts: yes
          plugin_habits_facts: yes
